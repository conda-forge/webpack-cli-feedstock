context:
  version: "7.2.1"

package:
  name: webpack-cli
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/webpack-cli/-/webpack-cli-${{ version }}.tgz
  sha256: 1b1a572f4526fac81f8a8d2ab2a866ab763ec391b37e24d99bcbcdc8f08f92d8

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - webpack-cli --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: A bundler for javascript and friends.
  homepage: https://github.com/webpack/webpack-cli
  repository: https://github.com/webpack/webpack-cli

extra:
  recipe-maintainers:
    - danielnachun
